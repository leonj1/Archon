# Railway Multi-Service Configuration for Archon
# This configuration deploys all Archon services to Railway.app
# Each service is defined with its build context, Dockerfile, and environment variables

# Database Migration Service
# Runs database migrations using Flyway before other services start
[[services]]
name = "archon-migrations"
dockerfile = "Dockerfile.migrations"
source = "."

[services.build]
context = "."
dockerfile = "Dockerfile.migrations"

[[services.environment]]
ARCHON_DB_BACKEND = "sqlite"
ARCHON_SQLITE_PATH = "/data/archon.db"
# SUPABASE_URL - Set in Railway dashboard
# SUPABASE_SERVICE_KEY - Set in Railway dashboard (encrypted)
# SUPABASE_DB_URL - Optional, set in Railway dashboard if using Supabase PostgreSQL
# SUPABASE_DB_PASSWORD - Optional, set in Railway dashboard if using Supabase PostgreSQL
# SUPABASE_DB_HOST - Optional, set in Railway dashboard if using Supabase PostgreSQL
# SUPABASE_DB_PORT - Optional, defaults to 5432
# SUPABASE_DB_NAME - Optional, defaults to postgres
# SUPABASE_DB_USER - Optional, defaults to postgres

# Main Backend Service (FastAPI + Crawling)
# Core API service handling knowledge management and business logic
[[services]]
name = "archon-server"
dockerfile = "python/Dockerfile.server"
source = "python"

[services.build]
context = "python"
dockerfile = "Dockerfile.server"

[services.deploy]
startCommand = "python -m uvicorn src.server.main:app --host 0.0.0.0 --port $PORT"

[services.healthcheck]
path = "/health"
timeout = 10
interval = 30

[[services.environment]]
ARCHON_DB_BACKEND = "sqlite"
ARCHON_SQLITE_PATH = "/data/archon.db"
ARCHON_SKIP_DB_INIT = "true"
SERVICE_DISCOVERY_MODE = "railway"
LOG_LEVEL = "INFO"
ARCHON_SERVER_PORT = "$PORT"
ARCHON_MCP_URL = "${{archon-mcp.RAILWAY_PRIVATE_DOMAIN}}"
ARCHON_AGENTS_URL = "${{archon-agents.RAILWAY_PRIVATE_DOMAIN}}"
AGENTS_ENABLED = "false"
ARCHON_HOST = "0.0.0.0"
# SUPABASE_URL - Set in Railway dashboard
# SUPABASE_SERVICE_KEY - Set in Railway dashboard (encrypted)
# OPENAI_API_KEY - Optional, set in Railway dashboard (encrypted)
# LOGFIRE_TOKEN - Optional, set in Railway dashboard

# MCP Server Service (IDE Integration)
# Lightweight HTTP-based MCP server for AI IDE tools
[[services]]
name = "archon-mcp"
dockerfile = "python/Dockerfile.mcp"
source = "python"

[services.build]
context = "python"
dockerfile = "Dockerfile.mcp"

[services.deploy]
startCommand = "python -m src.mcp_server.main"

[services.healthcheck]
path = "/health"
timeout = 10
interval = 30

[[services.environment]]
ARCHON_SQLITE_PATH = "/data/archon.db"
SERVICE_DISCOVERY_MODE = "railway"
TRANSPORT = "sse"
LOG_LEVEL = "INFO"
ARCHON_MCP_PORT = "$PORT"
API_SERVICE_URL = "${{archon-server.RAILWAY_PRIVATE_DOMAIN}}"
AGENTS_SERVICE_URL = "${{archon-agents.RAILWAY_PRIVATE_DOMAIN}}"
AGENTS_ENABLED = "false"
# SUPABASE_URL - Set in Railway dashboard
# SUPABASE_SERVICE_KEY - Set in Railway dashboard (encrypted)
# LOGFIRE_TOKEN - Optional, set in Railway dashboard

# AI Agents Service (ML/Reranking) - Optional
# PydanticAI-based agents for document processing and ML features
[[services]]
name = "archon-agents"
dockerfile = "python/Dockerfile.agents"
source = "python"

[services.build]
context = "python"
dockerfile = "Dockerfile.agents"

[services.deploy]
startCommand = "python -m uvicorn src.agents.server:app --host 0.0.0.0 --port $PORT"

[services.healthcheck]
path = "/health"
timeout = 10
interval = 30

[[services.environment]]
SERVICE_DISCOVERY_MODE = "railway"
LOG_LEVEL = "INFO"
ARCHON_AGENTS_PORT = "$PORT"
API_SERVICE_URL = "${{archon-server.RAILWAY_PRIVATE_DOMAIN}}"
# SUPABASE_URL - Set in Railway dashboard
# SUPABASE_SERVICE_KEY - Set in Railway dashboard (encrypted)
# OPENAI_API_KEY - Set in Railway dashboard (encrypted)
# LOGFIRE_TOKEN - Optional, set in Railway dashboard

# Frontend Service (React UI)
# React 18 + TypeScript + Vite frontend application
[[services]]
name = "archon-frontend"
dockerfile = "archon-ui-main/Dockerfile"
source = "archon-ui-main"

[services.build]
context = "archon-ui-main"
dockerfile = "Dockerfile"

[services.deploy]
startCommand = "npm run preview -- --host 0.0.0.0 --port $PORT"

[services.healthcheck]
path = "/"
timeout = 10
interval = 30

[[services.environment]]
HOST = "0.0.0.0"
PROD = "true"
DOCKER_ENV = "true"
VITE_API_URL = "${{archon-server.RAILWAY_PUBLIC_DOMAIN}}"
# VITE_ALLOWED_HOSTS - Optional, comma-separated list of allowed hosts
# VITE_SHOW_DEVTOOLS - Optional, set to "true" for development
